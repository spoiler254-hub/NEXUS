<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nexus — Community</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet"/* styles.css — futuristic theme for Nexus */
--accent-1: #6EE7F3; /* cyan */
--accent-2: #8B5CF6; /* violet */
--accent-3: #FF7AB6; /* pink */
--muted: rgba(255,255,255,0.65);
--glass-border: rgba(255,255,255,0.08);
}


*{box-sizing:border-box}
html,body{height:100%}
body{
margin:0;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
background: radial-gradient(1200px 600px at 10% 10%, rgba(139,92,246,0.08), transparent),
radial-gradient(800px 500px at 90% 80%, rgba(255,122,182,0.05), transparent),
var(--bg-1);
color:white;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}


#bg-anim{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0.9}
#bg-anim:before{
content:'';position:absolute;inset:-20% -10%;
background:linear-gradient(120deg, rgba(107,114,255,0.08), rgba(255,122,182,0.06));
filter:blur(80px);
animation: float 14s ease-in-out infinite alternate;
}
@keyframes float{from{transform:translateY(-30px)}to{transform:translateY(30px)}}


.app-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
.brand{text-align:center;margin-bottom:18px}
.brand h1{letter-spacing:6px;margin:0;font-weight:700;font-size:36px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{margin:6px 0 0;color:var(--muted);font-size:13px}


.card{background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid var(--glass-border);backdrop-filter:blur(8px);padding:18px;border-radius:14px;box-shadow:0 6px 30px rgba(2,6,23,0.6);}
.auth-card{width:340px;max-width:92vw;text-align:center}


.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}
.btn.primary{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#071026;border:none}


.oauth-buttons{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.oauth{position:relative;padding-left:46px;text-align:left}
.oauth::before{content:'';position:absolute;left:12px;top:8px;width:28px;height:28px;border-radius:6px;background:linear-gradient(90deg,var(--accent-1),var(--accent-3));box-shadow:0 6px 20px rgba(107,114,255,0.08)}


.or{margin:10px 0;color:var(--muted);font-size:13px}
.login-form input{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:white}
.hidden{display:none}


.feed-header{display:flex;justify-content:space-between;align-items:center;width:680px;max-width:92vw;margin-bottom:12px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.post{border-radius:12px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));border:1px solid var(--glass-border)}
.post img{width:100%;height:220px;object-fit:cover;display:block}
.post .meta{padding:10px;color:var(--muted);font-size:13px}


.foot{margin-top:22px;color:rgba(255,255,255,0.25);font-size:13px}


/* small screens tweaks */
@media (max-width:520px){.auth-card{width:92vw}.feed-header{width:92vw}} ">
</head>
<body>
<div id="bg-anim"></div>


<main class="app-shell">
<header class="brand">
<h1>NEXUS</h1>
<p class="tag">Connect • Share • Evolve</p>
</header>


<section id="auth" class="card auth-card">
<h2>Welcome back</h2>
<p>Sign in to join the Nexus community.</p>


<div class="oauth-buttons">
<button id="btn-google" class="btn oauth">Sign in with Google</button>
<button id="btn-microsoft" class="btn oauth">Sign in with Microsoft</button>
<button id="btn-apple" class="btn oauth">Sign in with Apple</button>
</div>


<div class="or">— or —</div>
<form id="email-login" class="login-form">
<input name="email" placeholder="Email" type="email" required />
<input name="password" placeholder="Password" type="password" required />
<button class="btn primary" type="submit">Sign in</button>
</form>


</section>


<section id="feed" class="hidden">
<div class="feed-header">
<h2>Home</h2>
<button id="btn-new" class="btn">New Post</button>
</div>
<div id="posts" class="posts"></div>
</section>


<footer class="foot">© <span id="year"></span> Nexus — Built for tomorrow</footer>
</main>


<script src="/app.js"></script>
</body>
</html>
